brand: brikkin
name: Brikkin
group: Insomniacs
website: https://brikkin.com
oneLiner: >-
  The real estate creator network — connecting developers with creators to
  co-create content that generates demand rather than views.
positioning: >-
  Creator marketing in real estate usually produces reach and no attribution,
  because the people booking the creators are not the people measuring the
  funnel. Brikkin runs the creator network and the tracking as one thing, so a
  reel is judged on enquiries and shortlisting rather than impressions.
