# Register and vocabulary by buyer type. Matched loosely against the researched
# industry and sub-sectors, with `default` as the fallback.
#
# For Insomniacs the meaningful axis is developer segment, not "industry" —
# a luxury promoter and a plotted-land developer buy marketing differently and
# judge it on different numbers.

industries:
  - key: default
    label: General B2B
    notes:
      - Lead with the problem in their language, not your capability in yours.
      - One concrete proof point beats three general ones.
    vocabulary: []
    avoid:
      - Unexplained internal jargon
    specsThatMatter: []

  - key: real estate
    label: Real estate developer (general)
    notes:
      - The only numbers that matter are bookings, absorption against target, and cost per booking. Leads and impressions are means, not results.
      - Name the micro-market. A developer can tell instantly whether you understand their catchment.
      - Inventory ageing is the pain nobody advertises. A slow tower is worth more to them than a launch.
      - Assume they are pitched constantly. The opening line has to be something they have not read before.
    vocabulary:
      - absorption rate
      - cost per booking
      - site visits
      - inventory ageing
      - channel partner
      - micro-market
      - carpet area
      - possession timeline
      - RERA registration
    avoid:
      - '"brand building" with no measurement attached'
      - "360-degree campaign"
      - impressions and reach as headline outcomes
    specsThatMatter:
      - attribution
      - reporting cadence
      - markets
      - engagement model
      - compliance

  - key: luxury
    label: Luxury and premium residential
    notes:
      - Discretion is the product. Volume tactics read as damage to the brand.
      - The buyer pool is small and known; targeting precision matters more than reach.
      - NRI and HNI channels are usually a material share of the sale.
    vocabulary:
      - HNI
      - NRI
      - private preview
      - curated inventory
      - per-square-foot realisation
    avoid:
      - Discount framing
      - Mass-market performance language
    specsThatMatter:
      - markets
      - attribution
      - engagement model

  - key: plotted
    label: Plotted development and branded land
    notes:
      - There is no show flat. The entire sale is trust in the brand and clarity of title, so the marketing problem is credibility rather than desire.
      - Investment framing dominates — but appreciation and returns claims are a regulatory trap. Keep to what is documented.
      - Buyers are frequently out of state, so regional creative variance matters more here than anywhere else.
    vocabulary:
      - clear title
      - land parcel
      - appreciation corridor
      - infrastructure trigger
      - second home
    avoid:
      - Any promise of returns or assured appreciation
      - Vague "investment opportunity" language with no substantiation
    specsThatMatter:
      - markets
      - compliance
      - attribution

  - key: commercial
    label: Commercial and office
    notes:
      - The buyer is an institution or a business, not a family. Yield, tenancy and fit-out timelines are the frame.
      - Sales cycles are long and committee-driven; write for forwarding.
    vocabulary:
      - yield
      - grade A
      - tenancy
      - fit-out
      - leasable area
    avoid:
      - Emotional or lifestyle framing
    specsThatMatter:
      - engagement model
      - reporting cadence
      - attribution

  - key: affordable
    label: Affordable and mid-income housing
    notes:
      - Volume business with thin margins. Cost per booking is the entire conversation.
      - Home-loan eligibility and subsidy schemes drive conversion more than creative does.
      - Channel-partner performance often outweighs digital — say how your work supports it rather than replacing it.
    vocabulary:
      - cost per booking
      - loan eligibility
      - channel partner
      - conversion rate
      - walk-ins
    avoid:
      - Premium or lifestyle positioning
      - Anything that reads as expensive
    specsThatMatter:
      - attribution
      - reporting cadence
      - engagement model

  - key: proptech
    label: Proptech and real estate SaaS
    notes:
      - Technical buyer. Integration surface and data ownership come up early.
      - They will ask how your platform differs from what they could build.
    vocabulary:
      - integrations
      - API
      - data residency
      - funnel instrumentation
    avoid:
      - Agency-speak
    specsThatMatter:
      - integrations
      - products
      - adoption
