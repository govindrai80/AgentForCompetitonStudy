name: Northwind Systems
website: https://northwind.example
oneLiner: We take B2B SaaS platforms that have outgrown their architecture and make them fast, observable and cheap to run.
positioning: >-
  Most scale-up engineering teams know exactly what is wrong with their platform
  and have no capacity to fix it while shipping features. We embed a small senior
  team for a fixed window, fix the specific thing that is hurting, and leave the
  client's own engineers able to maintain it.
foundedYear: 2017
headquarters: Bengaluru, India
teamSize: "45 engineers"

