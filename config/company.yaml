services:
  - id: performance-marketing
    name: Performance Marketing
    description: Paid acquisition across search, social and programmatic, run against booking targets rather than lead counts.
    positioning: >-
      Real estate media buying fails in a specific way: cost per lead falls while
      cost per booking rises, because the channels that produce cheap leads
      produce the wrong ones. We optimise on what happens after the form fill.
    idealFor:
      - Developers with live inventory and a defined absorption target
      - Launches needing regional messaging across multiple metros
      - Teams whose cost per booking is rising while cost per lead falls
    specs:
      engagement model: Retained, with a named strategist and media planner
      markets: Mumbai, Pune, Bengaluru, Delhi NCR, Hyderabad, plus NRI markets
      channels: Google, Meta, programmatic display, OTT, portals
      attribution: Lead to site visit to booking, via Lead Matrix
      reporting cadence: Real-time dashboard plus a weekly review
      compliance: RERA registration details carried in every creative; ASCI codes observed
    proofPoints:
      - Campaigns are reported on bookings, not impressions
      - Regional creative variants rather than one national message

  - id: brand-creative
    name: Brand, Content and Creative
    description: Positioning, visual communication, content strategy and campaign films for a project or a developer brand.
    positioning: >-
      A project's positioning has to survive contact with a site visit. We build
      the story from what the project actually is — location, plan, spec,
      neighbourhood — rather than from a mood board.
    idealFor:
      - New launches needing a positioning platform
      - Developers repositioning an older or slow-moving project
      - Land and plotted development, where the product is hardest to dramatise
    specs:
      engagement model: Project-based or retained
      deliverables: Positioning platform, identity, campaign film, collateral, site branding
      compliance: RERA registration number and website on all advertising; ASCI codes observed
    proofPoints:
      - Built for real estate only — no adaptation of an FMCG playbook

  - id: martech-ireps
    name: iREPS and Totality Platform
    description: The real estate technology suite — sales, marketing and customer-experience tooling for developers.
    positioning: >-
      Built inside an agency that runs campaigns, so the tooling reflects how a
      developer's sales process actually works rather than how a generic CRM
      assumes it does.
    idealFor:
      - Developers running several projects with no single view of the funnel
      - Sales teams whose call centre performance is invisible
      - Developers with a large existing database and no referral motion
    specs:
      engagement model: Licence plus implementation
      products: iREPS suite, Lead Matrix, Repeople by RealtyX, Totality
      in development: Integrated Customer Experience (ICX) platform — unified sales and marketing dashboard
      adoption: "In use by 80+ realtors in India"
      data partnership: CRE Matrix, for real estate intelligence
    proofPoints:
      - "Released from the third year of operations; in use by 80+ realtors"
      # TODO: add integration list, deployment model and data-residency posture —
      # Indian developers increasingly ask, and an enterprise buyer will ask first.

  - id: crm-leads
    name: Lead Management and CRM
    description: Lead funnel instrumentation, nurture, and call-centre performance measurement.
    positioning: >-
      Most developers lose more revenue between enquiry and site visit than they
      do in media. Lead Matrix makes that gap visible in real time, including
      how the call centre is actually performing.
    idealFor:
      - Developers whose enquiry-to-site-visit conversion is unmeasured
      - Multi-project portfolios with inconsistent lead handling
    specs:
      engagement model: Platform plus process design
      capabilities: Real-time funnel tracking, nurture automation, call-centre efficiency measurement
      integrations: "TODO — confirm which CRMs and dialers are supported"
    proofPoints:
      - Call-centre efficiency is measured, not assumed

  - id: influencer-social
    name: Influencer and Social
    description: Creator-led campaigns wired into performance marketing and CRM, so reach converts into tracked enquiries.
    positioning: >-
      Creator work in real estate usually produces views and no attribution. We
      run it through the same tracking as paid, so a reel is judged on enquiries.
    idealFor:
      - Developers targeting first-time buyers and younger cohorts
      - Launches needing reach in a specific micro-market
    specs:
      engagement model: Campaign-based
      programme: Sleepless Rangers BEAT — 50 handpicked creators, ₹25 lakh prize pool
      attribution: Creator content tracked through to enquiries via Lead Matrix
    proofPoints:
      - Creator output is measured on tracked enquiries rather than views

differentiators:
  - Built for real estate only, since 2014 — not a generalist agency with a realty desk
  - Marketing and the technology underneath it come from the same firm, so attribution is not stitched together across vendors
  - Regional creative and media by metro, rather than one national message
  - "iREPS/Totality in use by 80+ realtors — the tooling is proven outside our own campaigns"

# Signals that mean we should not pitch at all. The selector checks these against
# the research and reports any that fire.
#
# The competitor line below is load-bearing: it tells the competitor engine to
# treat an existing client who is a direct rival of the prospect as a MAJOR
# caution rather than a minor one. Remove it and those become informational.
disqualifiers:
  - Direct competitor of an existing client in the same micro-market, without written clearance from both
  - Project has no RERA registration — we cannot advertise it
  - Developer wants a single campaign with no measurement, rather than a retained relationship
  - "TODO: minimum project ticket size or media budget below which this is not worth pursuing"

# Claims that may never be made, for regulatory or contractual reasons. Enforced
# by substring in the deterministic gate and in substance by the auditor.
#
# The returns-related entries matter most: promising appreciation or assured
# returns on property is the fastest way to a regulatory problem in India.
forbiddenClaims:
  - guaranteed returns
  - assured returns
  - guaranteed appreciation
  - risk-free investment
  - we guarantee
  - guarantee a
  - "no. 1"
  - "number 1 agency"

# Where a researcher should look for your kind of prospect. These are injected
# into the analyst brief, so the research goes to real-estate sources rather
# than generic company-research sources.
researchHints:
  - RERA portals for the relevant state (MahaRERA, K-RERA, TG-RERA, HARERA, UP-RERA) — registered projects, launch dates, declared inventory and completion status are public and authoritative
  - The developer's own project microsites and price lists, for current inventory and possession timelines
  - Trade press — RealtyPlus, RealtyNXT, Moneycontrol Real Estate, ET Realty, Hindustan Times HT Estates
  - Quarterly residential market reports from Anarock, Knight Frank India, JLL India and CBRE India for absorption and unsold-inventory context in the relevant micro-market
  - The developer's hiring — a sudden run of sales, CRM or digital-marketing roles usually means a launch or a channel problem
  - Channel-partner and broker chatter on LinkedIn, for what is actually moving
  - Listed developers' investor presentations and earnings calls, which state absorption, collections and launch pipeline directly
  - Their social and paid presence — what they are currently running tells you what they believe is working
