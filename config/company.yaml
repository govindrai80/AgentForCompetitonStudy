name: Insomniacs
website: https://insomniacs.in
oneLiner: >-
  India's real estate-focused marketing and technology network — strategy,
  creative, media, performance and the martech stack underneath, under one roof.
positioning: >-
  Most agencies sell a developer campaigns and hand back impressions. Insomniacs
  is built only for real estate, so the work is judged on sales: lead quality,
  site visits, and homes booked. The technology layer — iREPS, Lead Matrix,
  Totality — exists so the line from a media rupee to a booking is visible
  rather than asserted.
