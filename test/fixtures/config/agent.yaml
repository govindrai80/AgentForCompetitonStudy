    companyProfile: test/fixtures/config/company.yaml
  sibling:
    companyProfile: test/fixtures/config/sibling.yaml
paths:
  companyProfile: test/fixtures/config/company.yaml
  locales: config/locales.yaml
  industries: config/industries.yaml
  caseStudies: test/fixtures/data/case-studies
  clients: test/fixtures/data/clients.csv
