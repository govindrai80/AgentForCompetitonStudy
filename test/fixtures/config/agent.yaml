model: claude-opus-5
effort: high
refusalFallback: { enabled: true, model: claude-opus-4-8 }
research: { maxSearches: 12, maxFetches: 8, maxContinuations: 4 }
matching: { shortlistSize: 12, maxCited: 2 }
output: { dir: out, failOnBlock: true }
defaultBrand: fixture
brands:
